<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Réinitialiser la qualité — visite 3D Berlin</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14130f; color: #f4f0e8;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  h1 { font: 400 28px "Iowan Old Style", Georgia, serif; margin: 0 0 10px; }
  p { color: #cfc8ba; }
  a { display: block; margin: 10px 0; padding: 13px 16px; border-radius: 999px; text-decoration: none; font-weight: 600; }
  .a { background: #f4f0e8; color: #14130f; } .b { border: 1px solid rgba(255,255,255,.25); color: #f4f0e8; }
</style>
</head>
<body>
<main>
  <h1>Qualité réinitialisée</h1>
  <p id="msg">Cette page ne charge aucune 3D. Elle efface le réglage de qualité mémorisé sur ce téléphone.</p>
  <a class="a" href="./?q=auto">Ouvrir la visite en qualité Automatique</a>
  <a class="b" href="./?q=eco">Ouvrir la visite en mode Économique</a>
</main>
<script>
  try { localStorage.removeItem('yaya-berlin-qualite'); localStorage.removeItem('yaya-berlin-chargement'); } catch (e) {}
  document.cookie = 'yaya-berlin-chargement=; path=/; max-age=0';
</script>
</body>
